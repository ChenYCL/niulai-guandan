<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>牛来掼蛋</title>
  <link rel="stylesheet" href="/style.css?v=nl42" />
</head>
<body>
  <div id="orient-gate" class="orient-gate hidden">
    <div class="orient-card">
      <div class="phone-ico">📱</div>
      <p data-i18n="orient.turn">请把手机横过来</p>
      <p class="sub" data-i18n="orient.sub">本桌强制横屏全屏</p>
      <button id="btn-enter-fs" class="btn gold lg" data-i18n="orient.fs">进入全屏</button>
    </div>
  </div>
  <div id="lobby" class="screen">
    <div class="lobby-bg"></div>
    <div class="lobby-card">
      <div class="lang-switch lang-switch-lobby" role="group" aria-label="Language">
        <button type="button" data-lang="zh" title="中文">中</button>
        <button type="button" data-lang="ja" title="日本語">日</button>
        <button type="button" data-lang="en" title="English">EN</button>
      </div>
      <canvas id="lobby-logo" width="640" height="160"></canvas>
      <p class="tagline" data-i18n="lobby.tagline">四人两队 · 升级争先</p>
      <label class="field">
        <span data-i18n="lobby.nick">昵称</span>
        <input id="nick" maxlength="10" placeholder="怎么称呼你" data-i18n-placeholder="lobby.nick_ph" autocomplete="nickname" />
      </label>
      <button id="btn-create" class="btn gold lg" data-i18n="lobby.create">创建房间</button>
      <div class="join-row">
        <input id="room-code" maxlength="4" placeholder="房间码" data-i18n-placeholder="lobby.room_ph" class="code-in" autocomplete="off" />
        <button id="btn-join" class="btn ghost lg" data-i18n="lobby.join">加入</button>
      </div>
      <p class="hint-line" data-i18n="lobby.hint">人不够自动补机器人，一个人也能开打。进贡已做，无抗贡。</p>
    </div>
  </div>

  <div id="table" class="screen hidden">
    <canvas id="room-gl" class="room-gl" aria-hidden="true"></canvas>
    <header class="hud">
      <div class="hud-left">
        <div class="room-chip">
          <span data-i18n="hud.room">房间</span>
          <b id="hud-code">----</b>
          <button id="btn-copy" class="mini" data-i18n="hud.copy">复制邀请</button>
        </div>
      </div>
      <div class="hud-mid">
        <div class="level-badge">
          <span data-i18n="hud.level">当前级牌</span>
          <b id="hud-level">2</b>
          <em id="hud-wild">逢人配 红心2</em>
        </div>
        <div class="team-lv" id="team-lv"></div>
      </div>
      <div class="hud-right">
        <div class="lang-switch lang-switch-hud" role="group" aria-label="Language">
          <button type="button" data-lang="zh" title="中文">中</button>
          <button type="button" data-lang="ja" title="日本語">日</button>
          <button type="button" data-lang="en" title="English">EN</button>
        </div>
        <button id="btn-bgm" class="icon-btn muted" title="背景乐" data-i18n-title="hud.bgm">♪</button>
        <button id="btn-sfx" class="icon-btn" title="音效" data-i18n-title="hud.sfx">🔊</button>
        <button id="btn-mic" class="icon-btn" title="麦克风" data-i18n-title="hud.mic">🎤</button>
        <button id="btn-fs" class="icon-btn" title="全屏" data-i18n-title="hud.fs">⛶</button>
      </div>
    </header>

    <div class="table-frame">
      <div class="table-scene">
        <div class="table-stage">
          <div class="table-shadow"></div>
          <div class="wood-rim">
            <div class="rim-gold"></div>
            <div class="rim-shine"></div>
            <div class="felt" id="felt">
              <div class="felt-far" aria-hidden="true"></div>
              <canvas id="felt-grain" class="felt-grain" width="640" height="360"></canvas>
              <canvas id="felt-logo" class="felt-logo" width="720" height="220"></canvas>
              <div class="center-stack" id="center-stack">
                <div class="last-play" id="last-play"></div>
                <div class="combo-name" id="combo-name"></div>
              </div>
              <div class="deck-pile" id="deck-pile"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="seat-layer">
        <div class="seat" data-rel="north" id="seat-north"></div>
        <div class="seat" data-rel="west" id="seat-west"></div>
        <div class="seat" data-rel="east" id="seat-east"></div>
        <div class="seat self" data-rel="south" id="seat-south"></div>
      </div>
    </div>

    <div class="dock">
      <div class="hand-wrap" id="hand-wrap">
        <div class="hand" id="hand"></div>
      </div>
      <div class="turn-banner hidden" id="turn-banner"></div>
      <div class="actions" id="actions">
        <button id="btn-pass" class="btn dark" data-i18n="act.pass">不出</button>
        <button id="btn-hint" class="btn ghost" data-i18n="act.hint">提示</button>
        <button id="btn-play" class="btn gold" data-i18n="act.play">出牌</button>
        <button id="btn-ready" class="btn gold hidden" data-i18n="act.ready">准备</button>
        <button id="btn-start" class="btn gold hidden" data-i18n="act.start">开始</button>
        <button id="btn-return" class="btn gold hidden" data-i18n="act.return">还贡</button>
        <button id="btn-auto" class="btn dark hidden" data-i18n="act.auto">托管</button>
        <button id="btn-autotake" class="btn ghost hidden" data-i18n="act.autotake_off">自动接管 · 关</button>
      </div>
    </div>
  </div>

  <div id="swap-modal" class="hidden">
    <div class="swap-panel">
      <p id="swap-text"></p>
      <div class="swap-actions">
        <button id="btn-swap-yes" class="btn gold" data-i18n="swap.accept">接受</button>
        <button id="btn-swap-no" class="btn dark" data-i18n="swap.decline">拒绝</button>
      </div>
    </div>
  </div>

  <div id="fly-layer"></div>
  <div id="fx-layer"></div>
  <div id="toast"></div>
  <div id="settle" class="hidden"></div>
  <audio id="remote-audio" autoplay playsinline></audio>
  <div id="remote-box"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="/combo.js?v=nl31"></script>
  <script src="/theme.js?v=nl42"></script>
  <script src="/room2d.js?v=nl41"></script>
  <script src="/i18n.js?v=nl31"></script>
  <script src="/app.js?v=nl42"></script>
</body>
</html>
